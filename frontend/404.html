    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Extract page name from URL parameter if it exists
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        if (page) {
            // Capitalize first letter and format
            const formattedPage = page.charAt(0).toUpperCase() + page.slice(1).replace('-', ' ');
            document.getElementById('pageTitle').innerText = formattedPage + ' is coming soon';

            // Highlight the corresponding sidebar item
            const navMap = {
                'allowances': 'nav-allowances',
                'deductions': 'nav-deductions',
                'overtime': 'nav-overtime',
                'run-payroll': 'nav-run-payroll',
                'payslips': 'nav-payslips',
                'reports': 'nav-reports'
            };
            const navId = navMap[page];
            if (navId) {
                const link = document.getElementById(navId);
                if (link) {
                    link.classList.remove('bg-transparent', 'text-body');
                    link.classList.add('bg-primary', 'bg-opacity-10', 'text-primary', 'fw-semibold');
                    const icon = link.querySelector('i');
                    if (icon) {
                        icon.className = icon.className.replace('ph ', 'ph-fill ');
                        icon.className = icon.className.replace('text-muted', '');
                    }
                }
            }
        }
    </script>
