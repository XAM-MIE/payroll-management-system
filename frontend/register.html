<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Salary - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="bg-body-secondary">
    
    <div class="container-fluid p-0 overflow-hidden">
        <div class="row g-0 flex-lg-row-reverse" style="min-height: 100vh;">
            
            <!-- Right Side: Image / Branding (Reversed for Register page for variety) -->
            <div class="col-lg-6 d-none d-lg-block position-relative bg-primary">
                <img src="img/auth-bg.png" alt="Net Salary Background" class="position-absolute w-100 h-100" style="object-fit: cover; transform: scaleX(-1);">
                <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(62, 39, 35, 0.85) 0%, rgba(111, 78, 55, 0.4) 100%);"></div>
                <div class="position-absolute bottom-0 start-0 p-5 text-white w-100 z-1" style="backdrop-filter: blur(4px);">
                    <div class="d-flex align-items-center mb-3">
                        <i class="ph-fill ph-users-three fs-1 me-2 text-primary text-opacity-75"></i>
                        <h2 class="fw-bold mb-0">Join Net Salary</h2>
                    </div>
                    <p class="lead mb-0 fw-light">Empower your HR team with tools that save time, reduce errors, and keep employees happy.</p>
                </div>
            </div>

            <!-- Left Side: Register Form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-body">
                <main class="form-signin w-100 m-auto px-4 py-5" style="max-width: 450px;">
                    <form>
                        <div class="mb-5">
                            <h2 class="fw-bold mb-2">Create an Account</h2>
                            <p class="text-muted">Fill in your details below to get started.</p>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control rounded-3" id="floatingFirst" placeholder="First Name">
                                    <label for="floatingFirst">First Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control rounded-3" id="floatingLast" placeholder="Last Name">
                                    <label for="floatingLast">Last Name</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control rounded-3" id="floatingInput" placeholder="name@example.com">
                            <label for="floatingInput">Email address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword">Password</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control rounded-3" id="floatingPasswordConfirm" placeholder="Confirm Password">
                            <label for="floatingPasswordConfirm">Confirm Password</label>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                            <label class="form-check-label text-muted small" for="termsCheck">
                                I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>.
                            </label>
                        </div>

                        <button class="btn btn-primary w-100 py-3 rounded-3 fw-medium shadow-sm mb-4" type="button" onclick="window.location.href='layout.html'">
                            Create Account
                        </button>
                        
                        <div class="text-center">
                            <p class="text-muted">Already have an account? <a href="index.html" class="text-primary text-decoration-none fw-medium">Sign in</a></p>
                        </div>
                    </form>
                </main>
            </div>
            
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
